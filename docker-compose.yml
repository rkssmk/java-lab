services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-javalab}
      POSTGRES_USER: ${DB_ADMIN_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?Set DB_ADMIN_PASSWORD in .env}
      DB_USERNAME: ${DB_USERNAME:-javalab_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db-init/01-create-app-role.sh:/docker-entrypoint-initdb.d/01-create-app-role.sh:ro
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-javalab_app} -d ${DB_NAME:-javalab}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # No public port: PostgreSQL is reachable only from the backend network.

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-javalab}
      DB_USERNAME: ${DB_USERNAME:-javalab_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-true}
      APP_REGISTRATION_ENABLED: ${APP_REGISTRATION_ENABLED:-false}
      APP_LEGAL_LAUNCH_APPROVED: ${APP_LEGAL_LAUNCH_APPROVED:-false}
      LEGAL_OPERATOR_NAME: ${LEGAL_OPERATOR_NAME:-}
      LEGAL_OPERATOR_ADDRESS: ${LEGAL_OPERATOR_ADDRESS:-}
      LEGAL_CONTACT_EMAIL: ${LEGAL_CONTACT_EMAIL:-}
      LEGAL_PRIVACY_VERSION: ${LEGAL_PRIVACY_VERSION:-2026-11-draft-1}
      LEGAL_CONSENT_VERSION: ${LEGAL_CONSENT_VERSION:-2026-11-draft-1}
      LEGAL_TERMS_VERSION: ${LEGAL_TERMS_VERSION:-2026-11-draft-1}
      LEGAL_CONSENT_SHA256: ${LEGAL_CONSENT_SHA256:-}
      RUNNER_ENABLED: ${RUNNER_ENABLED:-false}
      JUDGE0_BASE_URL: ${JUDGE0_BASE_URL:-}
      JUDGE0_AUTH_TOKEN: ${JUDGE0_AUTH_TOKEN:-}
    volumes:
      - ./public:/app/public:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - private
      - edge
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./public:/srv:ro
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    networks:
      - edge
    security_opt:
      - no-new-privileges:true

networks:
  edge:
  private:
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
