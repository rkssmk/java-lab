server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        name: JSESSIONID
        http-only: true
        secure: ${APP_COOKIE_SECURE:true}
        same-site: lax
        path: /
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: java-lab-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/javalab}
    username: ${DB_USERNAME:javalab}
    password: ${DB_PASSWORD:local-only-change-me}
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          json_format_mapper: jackson
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

javalab:
  public-dir: ${JAVA_PUBLIC_DIR:/app/public}

app:
  registration:
    enabled: ${APP_REGISTRATION_ENABLED:false}
    legal-launch-approved: ${APP_LEGAL_LAUNCH_APPROVED:false}
    min-age: 18
  legal:
    operator-name: ${LEGAL_OPERATOR_NAME:}
    operator-address: ${LEGAL_OPERATOR_ADDRESS:}
    contact-email: ${LEGAL_CONTACT_EMAIL:}
    privacy-version: ${LEGAL_PRIVACY_VERSION:2026-11-draft-1}
    consent-version: ${LEGAL_CONSENT_VERSION:2026-11-draft-1}
    terms-version: ${LEGAL_TERMS_VERSION:2026-11-draft-1}
    consent-sha256: ${LEGAL_CONSENT_SHA256:}
  session:
    secure-cookies: ${APP_COOKIE_SECURE:true}
  runner:
    enabled: ${RUNNER_ENABLED:false}
    base-url: ${JUDGE0_BASE_URL:}
    auth-token: ${JUDGE0_AUTH_TOKEN:}
